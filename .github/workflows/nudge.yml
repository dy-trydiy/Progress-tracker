name: Daily check-in nudge

on:
  schedule:
    # Both candidate UTC hours for config.nudgeHourLocal (20:00) in
    # config.timezone (America/New_York): 00:00 UTC = 8pm EDT, 01:00 UTC =
    # 8pm EST. The job checks the local clock and only proceeds when it's
    # actually nudge hour, so the reminder lands at 8pm local all year.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check today and open a reminder issue
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("data/config.json", "utf8"));
            const log = JSON.parse(fs.readFileSync("data/log.json", "utf8"));
            const { owner, repo } = context.repo;

            const tz = config.timezone || "UTC";
            const today = new Intl.DateTimeFormat("en-CA", {
              timeZone: tz,
              year: "numeric", month: "2-digit", day: "2-digit",
            }).format(new Date());

            core.setOutput("nudge", "false");

            // Scheduled runs fire at every candidate UTC hour; only proceed at
            // the configured local hour. Manual runs skip the gate.
            if (context.eventName === "schedule" && Number.isInteger(config.nudgeHourLocal)) {
              const localHour = Number(new Intl.DateTimeFormat("en-US", {
                timeZone: tz, hour: "2-digit", hour12: false, hourCycle: "h23",
              }).format(new Date()));
              if (localHour !== config.nudgeHourLocal) {
                core.info(`Local hour ${localHour} != nudge hour ${config.nudgeHourLocal} — not this run.`);
                return;
              }
            }
            core.setOutput("today", today);
            core.setOutput("email", config.participantEmail || "");
            core.setOutput("goal", config.goalName || "the challenge");
            core.setOutput("dashboard", `https://${owner.toLowerCase()}.github.io/${repo}/`);

            if (today < config.startDate || today > config.endDate) {
              core.info(`${today} is outside the challenge window — no nudge.`);
              return;
            }
            if (log.entries && log.entries[today]) {
              core.info(`${today} is already reported — no nudge.`);
              return;
            }
            core.setOutput("nudge", "true");

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "daily-nudge", per_page: 100,
            });
            if (open.data.some((issue) => issue.title.includes(today))) {
              core.info("Reminder issue already open — no duplicate.");
              return;
            }

            const dashboardUrl = `https://${owner.toLowerCase()}.github.io/${repo}/`;
            await github.rest.issues.create({
              owner, repo,
              title: `⏰ Check-in reminder — ${today}`,
              labels: ["daily-nudge"],
              assignees: [owner],
              body: [
                `Today's result for **${config.goalName}** hasn't been reported yet.`,
                "",
                `👉 The participant reports right on the dashboard: ${dashboardUrl}`,
                "",
                "This reminder closes itself as soon as the check-in is recorded.",
              ].join("\n"),
            });

      - name: Push notification via ntfy.sh
        # No-account option: the participant subscribes to a secret topic in the
        # free ntfy app; this posts the nudge to it. Set the NTFY_TOPIC secret.
        if: steps.check.outputs.nudge == 'true' && env.NTFY_TOPIC != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GOAL: ${{ steps.check.outputs.goal }}
          DASHBOARD: ${{ steps.check.outputs.dashboard }}
        run: |
          curl -sS \
            -H "Title: ⏰ $GOAL — today isn't reported yet" \
            -H "Click: $DASHBOARD" \
            -H "Tags: alarm_clock" \
            -d "Open the dashboard and log today — it takes ten seconds. Every day counts toward the reward." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Email the participant
        # Runs only when today is unreported, a participant email is configured,
        # and the SMTP secrets exist. Defaults to Gmail (address + app password);
        # set the MAIL_SERVER / MAIL_PORT secrets to use any other SMTP provider
        # (e.g. Brevo) with its own username/password.
        if: steps.check.outputs.nudge == 'true' && steps.check.outputs.email != '' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          # implicit TLS on 465; STARTTLS otherwise (e.g. Brevo on 587)
          secure: ${{ secrets.MAIL_PORT == '' || secrets.MAIL_PORT == '465' }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Progress Tracker
          to: ${{ steps.check.outputs.email }}
          subject: "⏰ ${{ steps.check.outputs.goal }} — don't forget today's check-in"
          html_body: |
            <p>Today (${{ steps.check.outputs.today }}) hasn't been reported yet.</p>
            <p><a href="${{ steps.check.outputs.dashboard }}"><strong>Open the dashboard and log it</strong></a> — it takes ten seconds.</p>
            <p>Every clean day counts toward the reward. This email stops once today is recorded.</p>
